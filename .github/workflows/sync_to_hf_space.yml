name: Sync to Hugging Face Space

on:
  push:
    branches: [master]
    paths:
      - "dashboard/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: /ml-vrp
          hf_token: ${{ secrets.HF }}
          space_sdk: streamlit
          subdirectory: dashboard   